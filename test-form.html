<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Test - Muscle Mentors</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; color: #856404; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; }
        .form-group { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Contact Form Debug Test</h1>
    
    <div class="test-section">
        <h3>Configuration Test</h3>
        <div id="config-test">Loading...</div>
    </div>
    
    <div class="test-section">
        <h3>EmailJS Test</h3>
        <div id="emailjs-test">Loading...</div>
    </div>
    
    <div class="test-section">
        <h3>Form Elements Test</h3>
        <div id="form-test">Loading...</div>
    </div>
    
    <div class="test-section">
        <h3>Quick Test Form</h3>
        <form id="test-form">
            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Message:</label>
                <textarea name="message" required></textarea>
            </div>
            <button type="submit">Test Submit</button>
        </form>
        <div id="submit-result"></div>
    </div>

    <!-- Load the same scripts as the main page -->
    <script src="js/config.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script>
        // Test configuration
        function testConfiguration() {
            const configDiv = document.getElementById('config-test');
            
            if (typeof CONFIG === 'undefined') {
                configDiv.innerHTML = '<div class="error">❌ CONFIG object not found</div>';
                return;
            }
            
            let html = '<div class="success">✅ CONFIG object found</div>';
            html += `<div>EmailJS Service ID: ${CONFIG.EMAILJS.serviceID}</div>`;
            html += `<div>EmailJS Template ID: ${CONFIG.EMAILJS.templateID}</div>`;
            html += `<div>EmailJS Public Key: ${CONFIG.EMAILJS.publicKey}</div>`;
            html += `<div>Tawk.to Property ID: ${CONFIG.TAWKTO.propertyId}</div>`;
            
            configDiv.innerHTML = html;
        }
        
        // Test EmailJS
        function testEmailJS() {
            const emailjsDiv = document.getElementById('emailjs-test');
            
            if (typeof emailjs === 'undefined') {
                emailjsDiv.innerHTML = '<div class="error">❌ EmailJS library not loaded</div>';
                return;
            }
            
            let html = '<div class="success">✅ EmailJS library loaded</div>';
            
            if (CONFIG.EMAILJS.publicKey && CONFIG.EMAILJS.publicKey !== 'YOUR_EMAILJS_PUBLIC_KEY') {
                try {
                    emailjs.init(CONFIG.EMAILJS.publicKey);
                    html += '<div class="success">✅ EmailJS initialized successfully</div>';
                } catch (error) {
                    html += `<div class="error">❌ EmailJS initialization failed: ${error.message}</div>`;
                }
            } else {
                html += '<div class="warning">⚠️ EmailJS public key not configured</div>';
            }
            
            emailjsDiv.innerHTML = html;
        }
        
        // Test form elements
        function testFormElements() {
            const formDiv = document.getElementById('form-test');
            const form = document.getElementById('test-form');
            
            if (!form) {
                formDiv.innerHTML = '<div class="error">❌ Test form not found</div>';
                return;
            }
            
            let html = '<div class="success">✅ Test form found</div>';
            
            // Check if main contact form exists
            const mainForm = document.getElementById('contact-form');
            if (mainForm) {
                html += '<div class="success">✅ Main contact form found</div>';
            } else {
                html += '<div class="error">❌ Main contact form not found</div>';
            }
            
            formDiv.innerHTML = html;
        }
        
        // Test form submission
        document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('submit-result');
            const formData = new FormData(this);
            
            if (typeof emailjs !== 'undefined' && CONFIG.EMAILJS.publicKey !== 'YOUR_EMAILJS_PUBLIC_KEY') {
                resultDiv.innerHTML = '<div class="warning">⏳ Sending test email...</div>';
                
                emailjs.send(
                    CONFIG.EMAILJS.serviceID,
                    CONFIG.EMAILJS.templateID,
                    {
                        from_name: formData.get('name'),
                        from_email: formData.get('email'),
                        message: formData.get('message'),
                        to_name: 'Muscle Mentors Team'
                    }
                ).then(function(response) {
                    resultDiv.innerHTML = '<div class="success">✅ Test email sent successfully!</div>';
                }).catch(function(error) {
                    resultDiv.innerHTML = `<div class="error">❌ Test email failed: ${error.text || error.message}</div>`;
                });
            } else {
                resultDiv.innerHTML = '<div class="error">❌ EmailJS not properly configured</div>';
            }
        });
        
        // Run tests when page loads
        document.addEventListener('DOMContentLoaded', function() {
            testConfiguration();
            testEmailJS();
            testFormElements();
        });
    </script>
</body>
</html>
